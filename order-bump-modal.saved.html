<!-- Saved original order bump modal from index.html. -->
<div class="bump-modal" data-bump-modal aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="bump-title">
  <div class="bump-dialog">
    <button class="bump-x" type="button" data-bump-dismiss aria-label="Close">&times;</button>
    <div class="bump-topline">Optional add-on</div>
    <h2 id="bump-title">Want the messages written out for you?</h2>
    <p>
      Add 100 ready-to-use messages for everyday situations, so you are not staring at a blank box wondering what to type.
    </p>
    <label class="bump-option">
      <input type="checkbox" data-bump-checkbox />
      <span>
        <strong>Add the messages pack for &pound;7.50</strong>
        <span>Helpful examples for messages, admin, decisions, shopping, appointments, and confusing information.</span>
      </span>
    </label>
    <div class="bump-actions">
      <button class="bump-continue" type="button" data-bump-continue>Continue to checkout - &pound;19</button>
      <button class="bump-close" type="button" data-bump-close>No thanks, just the guide</button>
    </div>
  </div>
</div>
