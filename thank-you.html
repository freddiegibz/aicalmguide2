<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Confirmed</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#00875A;color:#0A0A0A;font-family:Arial,sans-serif;padding:24px}
.card{max-width:560px;background:#fff;border-radius:24px;padding:40px 32px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#00875A;font-weight:700;margin-bottom:14px}
h1{font-size:38px;line-height:1.05;margin:0 0 18px}
p{font-size:18px;line-height:1.6;margin:0;color:#333}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Purchase Confirmed</div>
  <h1>Thank you for your order.</h1>
  <p>Your purchase has been confirmed, and the product will be sent to your email shortly.</p>
</main>
</body>
</html>
