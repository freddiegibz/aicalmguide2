    <style>
      :root {
        --ink: #071b3f;
        --navy: #173761;
        --text: #172033;
        --muted: #5d6678;
        --blue: #1468c4;
        --green: #1f9d62;
        --paper: #f7f8fc;
        --line: rgba(7, 27, 63, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #f7f8fc 0%, #edf4fb 100%);
        color: var(--text);
        font-family: "Aptos", "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(34px, 6vw, 58px);
        border: 1px solid var(--line);
        background: #fffdf9;
        box-shadow: 0 22px 48px rgba(7, 27, 63, 0.09);
        text-align: center;
      }

      .tick {
        width: 68px;
        height: 68px;
        margin: 0 auto 22px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #eefaf2;
        color: var(--green);
        font-size: 2rem;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 18px auto 0;
        max-width: 42rem;
        font-size: 1.06rem;
        line-height: 1.68;
      }

      .keyword {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 18px;
        border: 1px dashed var(--blue);
        background: #eef6fb;
        color: var(--navy);
        font-size: 1.18rem;
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .actions {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 0 20px;
        border-radius: 8px;
        color: #fff;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 14px 28px rgba(7, 27, 63, 0.14);
      }

      .email {
        background: var(--blue);
      }

      .whatsapp {
        background: var(--green);
      }

      .small {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      @media (max-width: 640px) {
        body {
          padding: 0;
        }

        main {
          min-height: 100vh;
          display: grid;
          align-content: center;
          border: 0;
          box-shadow: none;
        }

        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tick" aria-hidden="true">✓</div>
      <h1>Your AI Clarity Session is ready to arrange.</h1>
      <p>
        To book your session, send the message below by email or WhatsApp and I’ll help arrange the next step.
      </p>
      <div class="keyword">AIClarity</div>
      <div class="actions">
        <a
          class="button email"
          href="mailto:adsbyalfred@protonmail.com?subject=AIClarity&body=AIClarity"
        >
          Email AIClarity
        </a>
        <a
          class="button whatsapp"
          href="https://wa.me/447428523955?text=AIClarity"
          target="_blank"
          rel="noopener"
        >
          WhatsApp AIClarity
        </a>
      </div>
      <p class="small">
        Email: adsbyalfred@protonmail.com · WhatsApp: +44 7428 523955
      </p>
    </main>
  </body>
</html>
